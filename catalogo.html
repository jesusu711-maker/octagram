<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Catálogo - Mi sitio</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav>
    <a href="index.html">Inicio</a> ·
    <a href="catalogo.html">Catálogo</a> ·
    <a href="acerca.html">Acerca</a>
  </nav>

  <h1>Catálogo</h1>
  <p>Lista de videojuegos cargada desde Supabase:</p>
  
  <ul id="lista-juegos">
    <li>Cargando juegos...</li>
  </ul>

  <script>
    const SUPABASE_URL = 'https://eftzdzrexcfesyzebauv.supabase.co';
    // 👇 BORRA LO DE ADENTRO DE LAS COMILLAS Y PEGA TU LLAVE COMPLETA (SIN PUNTOS SUSPENSIVOS)
    const SUPABASE_ANON_KEY = 'PEGA_AQUÍ_TU_LLAVE_COMPLETA';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function cargarJuegos() {
      const { data, error } = await supabaseClient
        .from('juegos')
        .select('*');

      const lista = document.getElementById('lista-juegos');

      if (error) {
        lista.innerHTML = `<li style="color:red;">Error: ${error.message}</li>`;
        return;
      }

      lista.innerHTML = '';

      data.forEach(juego => {
        const li = document.createElement('li');
        li.textContent = `${juego.titulo} (${juego.anio}) — Género: ${juego.genero} | Rating: ${juego.rating}`;
        lista.appendChild(li);
      });
    }

    cargarJuegos();
  </script>
</body>
</html>
