<script>
    // Tu Project URL armada con el Project ID
    const SUPABASE_URL = 'https://eftzdzrexcfesyzebauv.supabase.co';
    
    // Tu Publishable key que acabas de copiar
    const SUPABASE_ANON_KEY = 'sb_publishable_Nv-hQ0b1Uu1ObEPhDJos0w_CLbM1...'; // (pega la tuya completa)

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function cargarJuegos() {
      const { data, error } = await supabaseClient
        .from('juegos')
        .select('*');

      const lista = document.getElementById('lista-juegos');

      if (error) {
        lista.innerHTML = `<li style="color:red;">Error al cargar: ${error.message}</li>`;
        return;
      }

      lista.innerHTML = ''; 
      
      data.forEach(juego => {
        const li = document.createElement('li');
        li.textContent = `${juego.titulo} (${juego.anio}) — Género: ${juego.genero} | Rating: ${juego.rating}`;
        lista.appendChild(li);
      });
    }

    cargarJuegos();
  </script>
